services:
  db:
    image: postgres:16-alpine
    container_name: pizza-tracker-db
    environment:
      POSTGRES_USER: pizzauser
      POSTGRES_PASSWORD: pizzapass
      POSTGRES_DB: pizza_tracker
      POSTGRES_INITDB_ARGS: "--locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pizzauser -d pizza_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
